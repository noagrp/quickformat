<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Quick Format</title>
<style>
:root{color-scheme:light dark;--bg:#f5f5f3;--panel:#fff;--text:#171717;--muted:#6d6d6d;--line:#d9d9d5;--chip:#ededeb;--active:#171717;--activeText:#fff;--danger:#a33;--shadow:0 8px 28px rgba(0,0,0,.07)}
@media(prefers-color-scheme:dark){:root{--bg:#0f0f0f;--panel:#171717;--text:#f2f2f2;--muted:#999;--line:#303030;--chip:#242424;--active:#f2f2f2;--activeText:#111;--shadow:none}}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,textarea{font:inherit;color:inherit}.app{width:min(1100px,100%);margin:auto;padding:18px 14px 28px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.brand h1{font-size:1.18rem;margin:0}.brand p{margin:3px 0 0;color:var(--muted);font-size:.8rem}.modeBadge{font-size:.72rem;border:1px solid var(--line);padding:6px 9px;border-radius:999px;color:var(--muted)}
.toolbarShell,.workspace,.activeBar{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.toolbarShell{padding:10px;margin-bottom:10px}.toolbarHead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}.toolbarTitle{font-size:.76rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.navBtn,.iconBtn{border:0;background:transparent;padding:7px 9px;border-radius:9px;cursor:pointer}.navBtn:hover,.iconBtn:hover{background:var(--chip)}
.chips,.categories,.activeList{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none}.chips::-webkit-scrollbar,.categories::-webkit-scrollbar,.activeList::-webkit-scrollbar{display:none}.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--chip);padding:8px 11px;border-radius:999px;cursor:pointer;font-size:.82rem}.chip.active{background:var(--active);color:var(--activeText);border-color:var(--active)}.chip.command{background:transparent}.cat{border:0;background:transparent;color:var(--muted);padding:7px 9px;border-radius:9px;cursor:pointer;white-space:nowrap}.cat.active{background:var(--chip);color:var(--text)}
.activeBar{display:flex;align-items:center;gap:8px;padding:9px 10px;margin-bottom:10px;min-height:46px}.activeLabel{font-size:.75rem;color:var(--muted);flex:0 0 auto}.activeItem{font-size:.76rem;border:1px solid var(--line);border-radius:999px;padding:6px 9px;background:var(--chip);white-space:nowrap;cursor:pointer}.none{font-size:.78rem;color:var(--muted)}
.workspace{overflow:hidden}.workHead{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;border-bottom:1px solid var(--line);gap:10px}.stats{font-size:.75rem;color:var(--muted)}.workActions{display:flex;gap:5px}.iconBtn.danger{color:var(--danger)}textarea{display:block;width:100%;min-height:52vh;resize:vertical;border:0;outline:0;background:transparent;color:var(--text);padding:18px;font-size:1rem;line-height:1.55;tab-size:4}.tableHint{display:none;padding:8px 12px;border-top:1px solid var(--line);font-size:.74rem;color:var(--muted)}.tableHint.show{display:block}.bottom{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px}.primary{border:0;background:var(--active);color:var(--activeText);padding:11px 18px;border-radius:12px;font-weight:700;cursor:pointer}.note{font-size:.72rem;color:var(--muted)}.pop{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);opacity:0;background:var(--active);color:var(--activeText);padding:8px 12px;border-radius:999px;font-size:.78rem;pointer-events:none;transition:.18s}.pop.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:760px){.chips,.categories{flex-wrap:wrap;overflow:visible}.app{padding-top:28px}textarea{min-height:58vh}}
</style>
</head>
<body>
<main class="app">
<header class="top"><div class="brand"><h1>Quick Format</h1><p>Paste → format → copy</p></div><div id="modeBadge" class="modeBadge">Text mode</div></header>
<section class="toolbarShell"><div class="toolbarHead"><span id="toolbarTitle" class="toolbarTitle">Main</span><button id="moreBtn" class="navBtn" type="button">More ›</button></div><div id="mainTools" class="chips"></div><div id="moreTools" hidden><div id="categories" class="categories"></div><div id="categoryTools" class="chips" style="margin-top:8px"></div></div></section>
<section class="activeBar"><span class="activeLabel">Active</span><div id="activeList" class="activeList"><span class="none">No rules selected</span></div></section>
<section class="workspace"><div class="workHead"><span id="stats" class="stats">0 words · 0 characters</span><div class="workActions"><button id="undoBtn" class="iconBtn" type="button">Undo</button><button id="clearBtn" class="iconBtn danger" type="button">Clear</button></div></div><textarea id="editor" spellcheck="false" placeholder="Paste text, paragraphs, or copied Excel / Sheets cells here…"></textarea><div id="tableHint" class="tableHint">Table detected — tabs and rows are preserved when copied back to Excel or Google Sheets.</div></section>
<div class="bottom"><span class="note">Processed locally in your browser.</span><button id="copyBtn" class="primary" type="button">Copy</button></div>
</main><div id="toast" class="pop">Copied</div>
<script>
const NL=String.fromCharCode(10),TAB=String.fromCharCode(9);
const editor=document.getElementById('editor'),activeList=document.getElementById('activeList'),stats=document.getElementById('stats'),modeBadge=document.getElementById('modeBadge'),tableHint=document.getElementById('tableHint'),mainToolsEl=document.getElementById('mainTools'),moreToolsEl=document.getElementById('moreTools'),categoryToolsEl=document.getElementById('categoryTools'),categoriesEl=document.getElementById('categories'),toolbarTitle=document.getElementById('toolbarTitle'),moreBtn=document.getElementById('moreBtn');
const history=[],active=new Set();let selectedCategory='Lines',toastTimer;
function lines(s){return s.replaceAll(String.fromCharCode(13),'').split(NL)}
function titleCase(s){return s.toLowerCase().split(' ').map(w=>w? w[0].toUpperCase()+w.slice(1):w).join(' ')}
function sentenceCase(s){let out='',cap=true;for(const ch of s.toLowerCase()){if(cap&&/[a-z0-9]/i.test(ch)){out+=ch.toUpperCase();cap=false}else out+=ch;if(ch==='.'||ch==='!'||ch==='?')cap=true}return out}
function cleanPlain(s){return s.replaceAll('**','').replaceAll('__','').replaceAll('~~','').replaceAll('`','').replaceAll(String.fromCharCode(160),' ').replaceAll(String.fromCharCode(8203),'')}
function normalizeChars(s){return s.replaceAll('“','"').replaceAll('”','"').replaceAll('‘',"'").replaceAll('’',"'").replaceAll('–','-').replaceAll('—','-').replaceAll(String.fromCharCode(160),' ')}
function stripBullet(x){let t=x.trimStart();const marks=['• ','● ','○ ','▪ ','- ','* '];for(const m of marks)if(t.startsWith(m))return t.slice(m.length);const dot=t.indexOf('. ');if(dot>0&&dot<6&&Number.isFinite(Number(t.slice(0,dot))))return t.slice(dot+2);const par=t.indexOf(') ');if(par>0&&par<6&&Number.isFinite(Number(t.slice(0,par))))return t.slice(par+2);return t}
const rules={
upper:{label:'ABC',fn:s=>s.toUpperCase(),exclusive:'case'},lower:{label:'abc',fn:s=>s.toLowerCase(),exclusive:'case'},sentence:{label:'Sentence',fn:sentenceCase,exclusive:'case'},title:{label:'Title',fn:titleCase,exclusive:'case'},trim:{label:'Trim',fn:s=>lines(s).map(x=>x.trim()).join(NL)},spaces:{label:'Spaces',fn:s=>lines(s).map(x=>x.trim().split(' ').filter(Boolean).join(' ')).join(NL)},blank:{label:'Blank lines',fn:s=>{const a=lines(s),o=[];let blank=false;for(const x of a){if(x.trim()===''){if(!blank)o.push('');blank=true}else{o.push(x);blank=false}}return o.join(NL)}},noBlank:{label:'No blank lines',fn:s=>lines(s).filter(x=>x.trim()!=='').join(NL)},plain:{label:'Plain text',fn:cleanPlain},normalize:{label:'Normalize',fn:normalizeChars},join:{label:'Join lines',fn:s=>lines(s).join(' ')},dedupe:{label:'Duplicates',fn:s=>{const seen=new Set();return lines(s).filter(x=>{const k=x.trim();if(k===''||!seen.has(k)){if(k!=='')seen.add(k);return true}return false}).join(NL)}},sortAZ:{label:'Sort A–Z',command:true,fn:s=>lines(s).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true,sensitivity:'base'})).join(NL)},sortZA:{label:'Sort Z–A',command:true,fn:s=>lines(s).sort((a,b)=>b.localeCompare(a,undefined,{numeric:true,sensitivity:'base'})).join(NL)},reverse:{label:'Reverse',command:true,fn:s=>lines(s).reverse().join(NL)},noBullets:{label:'Remove bullets',fn:s=>lines(s).map(stripBullet).join(NL)},bullets:{label:'Add bullets',fn:s=>lines(s).map(x=>x.trim()? '• '+stripBullet(x):x).join(NL)},numbering:{label:'Number',fn:s=>{let n=0;return lines(s).map(x=>x.trim()? String(++n)+'. '+stripBullet(x):x).join(NL)}},tabsToSpaces:{label:'Tabs → spaces',fn:s=>s.split(TAB).join('    ')},commasToLines:{label:'Comma → lines',fn:s=>s.split(',').map(x=>x.trim()).join(NL)},linesToComma:{label:'Lines → comma',fn:s=>lines(s).map(x=>x.trim()).filter(Boolean).join(', ')},linesToSemi:{label:'Lines → ;',fn:s=>lines(s).map(x=>x.trim()).filter(Boolean).join('; ')},numbersOnly:{label:'Numbers only',fn:s=>Array.from(s).filter(ch=>'0123456789.,+-'.includes(ch)||ch===NL||ch===TAB).join('')},lettersNumbers:{label:'Letters + numbers',fn:s=>Array.from(s).filter(ch=>/[a-z0-9]/i.test(ch)||ch===' '||ch===NL||ch===TAB).join('')},removeEmoji:{label:'Remove emoji',fn:s=>Array.from(s).filter(ch=>ch.codePointAt(0)<127000).join('')}
};
const mainIds=['upper','lower','sentence','title','trim','spaces','blank','plain','noBullets','dedupe'];
const groups={Lines:['noBlank','join','dedupe','sortAZ','sortZA','reverse'],Lists:['noBullets','bullets','numbering'],Clean:['plain','normalize','trim','spaces','blank','noBlank','removeEmoji'],Convert:['tabsToSpaces','commasToLines','linesToComma','linesToSemi'],Data:['numbersOnly','lettersNumbers']};
function pushHistory(){if(history[history.length-1]!==editor.value){history.push(editor.value);if(history.length>40)history.shift()}}
function updateStats(){const t=editor.value,words=t.trim()?t.trim().split(/\s+/).length:0;stats.textContent=words+' word'+(words===1?'':'s')+' · '+t.length+' character'+(t.length===1?'':'s');const table=t.includes(TAB)&&t.includes(NL);modeBadge.textContent=table?'Table mode':'Text mode';tableHint.classList.toggle('show',table)}
function applyRules(){let out=editor.value;for(const id of active)out=rules[id].fn(out);editor.value=out;updateStats()}
function toggleRule(id){const r=rules[id];if(r.command){pushHistory();editor.value=r.fn(editor.value);applyRules();render();return}if(active.has(id))active.delete(id);else{if(r.exclusive)for(const a of Array.from(active))if(rules[a].exclusive===r.exclusive)active.delete(a);active.add(id)}pushHistory();applyRules();render()}
function chip(id){const r=rules[id],b=document.createElement('button');b.type='button';b.className='chip'+(active.has(id)?' active':'')+(r.command?' command':'');b.textContent=r.label;b.onclick=()=>toggleRule(id);return b}
function renderMain(){mainToolsEl.innerHTML='';for(const id of mainIds)mainToolsEl.appendChild(chip(id))}
function renderCategories(){categoriesEl.innerHTML='';for(const g of Object.keys(groups)){const b=document.createElement('button');b.type='button';b.className='cat'+(g===selectedCategory?' active':'');b.textContent=g;b.onclick=()=>{selectedCategory=g;renderCategories();renderCategoryTools()};categoriesEl.appendChild(b)}}
function renderCategoryTools(){categoryToolsEl.innerHTML='';for(const id of groups[selectedCategory])categoryToolsEl.appendChild(chip(id))}
function renderActive(){activeList.innerHTML='';if(!active.size){activeList.innerHTML='<span class="none">No rules selected</span>';return}for(const id of active){const b=document.createElement('button');b.type='button';b.className='activeItem';b.textContent=rules[id].label+' ×';b.onclick=()=>toggleRule(id);activeList.appendChild(b)}}
function render(){renderMain();renderCategories();renderCategoryTools();renderActive()}
function showToast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),1100)}
moreBtn.onclick=()=>{const enter=moreToolsEl.hidden;moreToolsEl.hidden=!enter;mainToolsEl.hidden=enter;toolbarTitle.textContent=enter?'More':'Main';moreBtn.textContent=enter?'‹ Main':'More ›'};
document.getElementById('undoBtn').onclick=()=>{if(history.length){editor.value=history.pop();updateStats();render()}};
document.getElementById('clearBtn').onclick=()=>{if(editor.value){pushHistory();editor.value='';updateStats()}};
document.getElementById('copyBtn').onclick=async()=>{try{await navigator.clipboard.writeText(editor.value);showToast('Copied')}catch(e){editor.select();document.execCommand('copy');showToast('Copied')}};
editor.addEventListener('paste',()=>setTimeout(()=>{pushHistory();applyRules()},0));editor.addEventListener('input',updateStats);
render();updateStats();
</script>
</body>
</html>
