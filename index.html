<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Quick Format</title>
<style>
:root{color-scheme:light dark;--bg:#f5f5f3;--panel:#fff;--text:#171717;--muted:#6d6d6d;--line:#d9d9d5;--chip:#ededeb;--active:#171717;--activeText:#fff;--danger:#a33;--warn:#9a6500;--shadow:0 8px 28px rgba(0,0,0,.07)}
@media(prefers-color-scheme:dark){:root{--bg:#0f0f0f;--panel:#171717;--text:#f2f2f2;--muted:#999;--line:#303030;--chip:#242424;--active:#f2f2f2;--activeText:#111;--warn:#e2b44d;--shadow:none}}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,textarea{font:inherit;color:inherit}.app{width:min(1100px,100%);margin:auto;padding:18px 14px 28px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.brand h1{font-size:1.18rem;margin:0}.brand p{margin:3px 0 0;color:var(--muted);font-size:.8rem}.modeBadge{font-size:.72rem;border:1px solid var(--line);padding:6px 9px;border-radius:999px;color:var(--muted)}
.panel,.workspace,.activeBar{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.panel{padding:10px;margin-bottom:10px}.panelHead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}.panelTitle{font-size:.76rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.chips,.activeList,.subChips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none}.chips::-webkit-scrollbar,.activeList::-webkit-scrollbar,.subChips::-webkit-scrollbar{display:none}.chip,.subChip{flex:0 0 auto;border:1px solid var(--line);background:var(--chip);padding:8px 11px;border-radius:999px;cursor:pointer;font-size:.82rem}.chip.open{background:var(--active);color:var(--activeText);border-color:var(--active)}.subWrap{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}.subTitle{font-size:.74rem;color:var(--muted);margin-bottom:7px}.subChip.active{background:var(--active);color:var(--activeText);border-color:var(--active)}.example{margin-top:8px;font-size:.74rem;color:var(--muted);min-height:18px}.example.warn{color:var(--warn)}
.activeBar{display:flex;align-items:center;gap:8px;padding:9px 10px;margin-bottom:10px;min-height:46px}.activeLabel{font-size:.75rem;color:var(--muted);flex:0 0 auto}.activeItem{font-size:.76rem;border:1px solid var(--line);border-radius:999px;padding:6px 9px;background:var(--chip);white-space:nowrap;cursor:pointer}.none{font-size:.78rem;color:var(--muted)}
.workspace{overflow:hidden}.workHead{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;border-bottom:1px solid var(--line);gap:10px}.stats{font-size:.75rem;color:var(--muted)}.workActions{display:flex;gap:5px}.iconBtn{border:0;background:transparent;padding:7px 9px;border-radius:9px;cursor:pointer}.iconBtn:hover{background:var(--chip)}.iconBtn.danger{color:var(--danger)}textarea{display:block;width:100%;min-height:52vh;resize:vertical;border:0;outline:0;background:transparent;color:var(--text);padding:18px;font-size:1rem;line-height:1.55;tab-size:4}.tableHint{display:none;padding:8px 12px;border-top:1px solid var(--line);font-size:.74rem;color:var(--muted)}.tableHint.show{display:block}.bottom{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px}.actions{display:flex;gap:8px}.primary,.secondary{padding:11px 18px;border-radius:12px;font-weight:700;cursor:pointer}.primary{border:0;background:var(--active);color:var(--activeText)}.secondary{border:1px solid var(--line);background:var(--panel)}.note{font-size:.72rem;color:var(--muted)}.pop{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);opacity:0;background:var(--active);color:var(--activeText);padding:8px 12px;border-radius:999px;font-size:.78rem;pointer-events:none;transition:.18s}.pop.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:760px){.chips,.subChips{flex-wrap:wrap;overflow:visible}.app{padding-top:28px}textarea{min-height:58vh}}
</style>
</head>
<body>
<main class="app">
<header class="top"><div class="brand"><h1>Quick Format</h1><p>Choose rules → paste → Process → copy</p></div><div id="modeBadge" class="modeBadge">Text mode</div></header>
<section class="panel"><div class="panelHead"><span class="panelTitle">Formatting</span><span class="panelTitle">Tap a tool for options</span></div><div id="tools" class="chips"></div><div id="subWrap" class="subWrap" hidden><div id="subTitle" class="subTitle"></div><div id="subTools" class="subChips"></div><div id="example" class="example"></div></div></section>
<section class="activeBar"><span class="activeLabel">Selected</span><div id="activeList" class="activeList"><span class="none">No rules selected</span></div></section>
<section class="workspace"><div class="workHead"><span id="stats" class="stats">0 words · 0 characters</span><div class="workActions"><button id="undoBtn" class="iconBtn" type="button">Undo</button><button id="clearBtn" class="iconBtn danger" type="button">Clear</button></div></div><textarea id="editor" spellcheck="false" placeholder="Paste text, paragraphs, or copied Excel / Sheets cells here…"></textarea><div id="tableHint" class="tableHint">Table detected — tabs and rows are preserved unless you deliberately choose a structure-changing rule.</div></section>
<div class="bottom"><span class="note">Nothing changes until you press Process.</span><div class="actions"><button id="processBtn" class="secondary" type="button">Process</button><button id="copyBtn" class="primary" type="button">Copy</button></div></div>
</main><div id="toast" class="pop"></div>
<script>
const NL=String.fromCharCode(10),TAB=String.fromCharCode(9),CR=String.fromCharCode(13);
const editor=document.getElementById('editor'),toolsEl=document.getElementById('tools'),subWrap=document.getElementById('subWrap'),subTitle=document.getElementById('subTitle'),subTools=document.getElementById('subTools'),example=document.getElementById('example'),activeList=document.getElementById('activeList'),stats=document.getElementById('stats'),modeBadge=document.getElementById('modeBadge'),tableHint=document.getElementById('tableHint');
const history=[],active=new Set();let openTool=null,toastTimer;
function lines(s){return s.replaceAll(CR,'').split(NL)}
function cells(line){return line.split(TAB)}
function mapCells(s,fn){return lines(s).map(row=>cells(row).map(fn).join(TAB)).join(NL)}
function titleCase(s){return s.toLowerCase().split(' ').map(w=>w? w[0].toUpperCase()+w.slice(1):w).join(' ')}
function sentenceCase(s){let out='',cap=true;for(const ch of s.toLowerCase()){if(cap&&/[a-z0-9]/i.test(ch)){out+=ch.toUpperCase();cap=false}else out+=ch;if(ch==='.'||ch==='!'||ch==='?')cap=true}return out}
function stripBullet(x){let t=x.trimStart();const marks=['• ','● ','○ ','▪ ','- ','* '];for(const m of marks)if(t.startsWith(m))return t.slice(m.length);const dot=t.indexOf('. ');if(dot>0&&dot<6&&Number.isFinite(Number(t.slice(0,dot))))return t.slice(dot+2);const par=t.indexOf(') ');if(par>0&&par<6&&Number.isFinite(Number(t.slice(0,par))))return t.slice(par+2);return t}
function addSpaceAfterComma(s){return mapCells(s,c=>c.replace(/,\s*/g,', ').trimEnd())}
function removeSpaceBeforePunct(s){return mapCells(s,c=>c.replace(/\s+([,.;:!?])/g,'$1'))}
function removeExtraSpaces(s){return mapCells(s,c=>c.replace(/ {2,}/g,' '))}
function trimCells(s){return mapCells(s,c=>c.trim())}
function removeEmoji(s){try{return s.replace(/\p{Extended_Pictographic}/gu,'').replace(/\uFE0F/g,'')}catch(e){return s}}
const rules={
upper:{label:'Make UPPERCASE',example:'abc → ABC',group:'Case',exclusive:'case',fn:s=>s.toUpperCase()},
lower:{label:'Make lowercase',example:'ABC → abc',group:'Case',exclusive:'case',fn:s=>s.toLowerCase()},
sentence:{label:'Sentence case',example:'HELLO WORLD. TEST → Hello world. Test',group:'Case',exclusive:'case',fn:sentenceCase},
title:{label:'Title Case',example:'hello world → Hello World',group:'Case',exclusive:'case',fn:titleCase},
trimLines:{label:'Trim Line Edges',example:'   ABC   → ABC',group:'Spaces',fn:s=>lines(s).map(x=>x.trim()).join(NL)},
trimCells:{label:'Trim Each Cell',example:'Excel cell "  ABC  " → "ABC"; rows/columns stay intact',group:'Spaces',fn:trimCells},
extraSpaces:{label:'Remove Extra Spaces',example:'ABC     DEF → ABC DEF; tabs/columns stay intact',group:'Spaces',fn:removeExtraSpaces},
commaSpace:{label:'Add Space After Commas',example:'73,74,84 → 73, 74, 84',group:'Spaces',fn:addSpaceAfterComma},
spaceBeforePunct:{label:'Remove Space Before Punctuation',example:'ABC , DEF → ABC, DEF',group:'Spaces',fn:removeSpaceBeforePunct},
keepOneBlank:{label:'Keep One Blank Line',example:'3 blank lines → 1 blank line',group:'Lines',exclusive:'blankLines',fn:s=>{const a=lines(s),o=[];let blank=false;for(const x of a){if(x.trim()===''){if(!blank)o.push('');blank=true}else{o.push(x);blank=false}}return o.join(NL)}},
removeBlank:{label:'Remove Blank Lines',example:'All empty rows are removed',group:'Lines',exclusive:'blankLines',fn:s=>lines(s).filter(x=>x.trim()!=='').join(NL)},
joinLines:{label:'Join All Lines',example:'A↵B → A B. Warning: removes row structure.',group:'Lines',structure:true,fn:s=>lines(s).join(' ')},
dedupe:{label:'Remove Duplicate Lines',example:'A↵A↵B → A↵B',group:'Lines',fn:s=>{const seen=new Set();return lines(s).filter(x=>{const k=x.trim();if(k===''||!seen.has(k)){if(k!=='')seen.add(k);return true}return false}).join(NL)}},
removeBullets:{label:'Remove Bullets / Numbering',example:'1. Apple → Apple',group:'Lists',exclusive:'listStyle',fn:s=>lines(s).map(stripBullet).join(NL)},
addBullets:{label:'Add Bullets',example:'Apple → • Apple',group:'Lists',exclusive:'listStyle',fn:s=>lines(s).map(x=>x.trim()? '• '+stripBullet(x):x).join(NL)},
addNumbers:{label:'Add Numbering',example:'Apple → 1. Apple',group:'Lists',exclusive:'listStyle',fn:s=>{let n=0;return lines(s).map(x=>x.trim()? String(++n)+'. '+stripBullet(x):x).join(NL)}},
plain:{label:'Remove Basic Markup',example:'**Hello** → Hello; removes ** __ ~~ and ` markers',group:'Clean',fn:s=>s.replaceAll('**','').replaceAll('__','').replaceAll('~~','').replaceAll('`','')},
normalize:{label:'Normalize Quotes / Dashes',example:'“Text” — test → "Text" - test',group:'Clean',fn:s=>s.replaceAll('“','"').replaceAll('”','"').replaceAll('‘',"'").replaceAll('’',"'").replaceAll('–','-').replaceAll('—','-').replaceAll(String.fromCharCode(160),' ')},
removeEmoji:{label:'Remove Emoji',example:'Hello 🙂 → Hello',group:'Clean',fn:removeEmoji},
tabsToSpaces:{label:'Tabs → 4 Spaces',example:'Changes tab separators into spaces. Warning: Excel/Sheets columns will no longer paste as separate cells.',group:'Convert',structure:true,exclusive:'convertShape',fn:s=>s.split(TAB).join('    ')},
commaToLines:{label:'Commas → New Lines',example:'A,B,C → A↵B↵C. Warning: every comma becomes a line break.',group:'Convert',structure:true,exclusive:'convertShape',fn:s=>s.split(',').map(x=>x.trim()).join(NL)},
linesToComma:{label:'New Lines → Commas',example:'A↵B↵C → A, B, C. Warning: row structure is removed.',group:'Convert',structure:true,exclusive:'convertShape',fn:s=>lines(s).map(x=>x.trim()).filter(Boolean).join(', ')},
numbersOnly:{label:'Keep Numbers Only',example:'Item A12 → 12. Letters and other characters are removed.',group:'Data',destructive:true,fn:s=>Array.from(s).filter(ch=>'0123456789.,+-'.includes(ch)||ch===NL||ch===TAB).join('')}
};
const groups={Case:['upper','lower','sentence','title'],Spaces:['trimLines','trimCells','extraSpaces','commaSpace','spaceBeforePunct'],Lines:['keepOneBlank','removeBlank','joinLines','dedupe'],Lists:['removeBullets','addBullets','addNumbers'],Clean:['plain','normalize','removeEmoji'],Convert:['tabsToSpaces','commaToLines','linesToComma'],Data:['numbersOnly']};
function isTable(){return editor.value.includes(TAB)&&editor.value.includes(NL)}
function updateStats(){const t=editor.value,words=t.trim()?t.trim().split(/\s+/).length:0;stats.textContent=words+' word'+(words===1?'':'s')+' · '+t.length+' character'+(t.length===1?'':'s');const table=isTable();modeBadge.textContent=table?'Table mode':'Text mode';tableHint.classList.toggle('show',table)}
function renderTools(){toolsEl.innerHTML='';for(const g of Object.keys(groups)){const b=document.createElement('button');b.type='button';b.className='chip'+(openTool===g?' open':'');b.textContent=g;b.onclick=()=>{openTool=openTool===g?null:g;example.textContent='';example.classList.remove('warn');renderTools();renderSub()};toolsEl.appendChild(b)}}
function selectRule(id){const r=rules[id];if(active.has(id)){active.delete(id)}else{if(r.exclusive)for(const a of Array.from(active))if(rules[a].exclusive===r.exclusive)active.delete(a);active.add(id)}example.textContent=r.example;example.classList.toggle('warn',!!(r.structure||r.destructive));renderSub();renderActive()}
function renderSub(){if(!openTool){subWrap.hidden=true;return}subWrap.hidden=false;subTitle.textContent=openTool+' options';subTools.innerHTML='';for(const id of groups[openTool]){const r=rules[id],b=document.createElement('button');b.type='button';b.className='subChip'+(active.has(id)?' active':'');b.textContent=r.label;b.onclick=()=>selectRule(id);subTools.appendChild(b)}if(!example.textContent){example.classList.remove('warn');example.textContent='Choose an option to see exactly what it changes.'}}
function renderActive(){activeList.innerHTML='';if(!active.size){activeList.innerHTML='<span class="none">No rules selected</span>';return}for(const id of active){const b=document.createElement('button');b.type='button';b.className='activeItem';b.textContent=rules[id].label+' ×';b.onclick=()=>{active.delete(id);renderSub();renderActive()};activeList.appendChild(b)}}
function showToast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),1400)}
document.getElementById('processBtn').onclick=()=>{if(!active.size){showToast('Choose a rule first');return}if(!editor.value){showToast('Paste or type text first');return}history.push(editor.value);if(history.length>40)history.shift();let out=editor.value;for(const id of active)out=rules[id].fn(out);editor.value=out;updateStats();showToast('Processed')};
document.getElementById('undoBtn').onclick=()=>{if(history.length){editor.value=history.pop();updateStats()}};
document.getElementById('clearBtn').onclick=()=>{if(editor.value){history.push(editor.value);editor.value='';updateStats()}};
document.getElementById('copyBtn').onclick=async()=>{try{await navigator.clipboard.writeText(editor.value);showToast('Copied')}catch(e){editor.select();document.execCommand('copy');showToast('Copied')}};
editor.addEventListener('input',updateStats);
renderTools();renderSub();renderActive();updateStats();
</script>
</body>
</html>
